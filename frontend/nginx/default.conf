# Serves the React build and forwards API, media and health requests to the API
# container. TLS is terminated in front of this container (host reverse proxy,
# load balancer…), which must send X-Forwarded-Proto.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream imotek_api {
    server api:8080;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # 5 MB photos plus multipart overhead; the API enforces the real limit.
    client_max_body_size 6m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    location /api/ {
        proxy_pass http://imotek_api;
    }

    location /media/ {
        proxy_pass http://imotek_api;
    }

    location = /health {
        proxy_pass http://imotek_api;
    }

    location = /health/db {
        proxy_pass http://imotek_api;
    }

    # Hashed build files never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes all serve index.html, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
