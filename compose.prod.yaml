# Production-like stack: PostgreSQL, a one-shot migration job, the API and the web front.
#   cp .env.prod.example .env.prod   # then set real values
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# TLS must be terminated in front of the "web" service (see README, "Deployment").

name: ${COMPOSE_PROJECT_NAME:-imotek-prod}

x-connection-string: &connection-string
  # Private network between containers. For a managed database add "SSL Mode=VerifyFull".
  # GSS (Kerberos) is not used; disabling it avoids a failed negotiation on every connection.
  ConnectionStrings__ImotekDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?};Gss Encryption Mode=Disable"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    # No published port: only the API and the migrator can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Applies pending EF Core migrations, then exits. The API starts only if it succeeded.
  migrate:
    build:
      context: ./backend
      target: migrator
    environment:
      <<: *connection-string
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    environment:
      <<: *connection-string
      ASPNETCORE_ENVIRONMENT: Production
      # Trust X-Forwarded-For/Proto from the web container (client IP for rate limiting, HTTPS detection).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      Security__HttpsRedirection: "false"
      # Only needed for the first start; remove once the admin account exists.
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/data/uploads
      - dataprotection-keys:/app/data/keys
    networks: [backend, frontend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  postgres-data:
  uploads:
  dataprotection-keys:
